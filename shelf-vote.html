<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf Vote</title>
<meta name="description" content="Rank the book club's candidates and see the winner under nine counting methods.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Young+Serif&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #EDF0EA; --surface: #FBFCF9; --ink: #1B2620; --muted: #5C6A62; --line: #D3DAD2;
  --accent: #1F5A48; --accent-ink: #FFFFFF; --accent-soft: #DCEBE3;
  --stamp: #5A3D8A; --rule: #C0463C; --lose: #F4E3E0;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121815; --surface: #1A221E; --ink: #E3E9E4; --muted: #9AA79F; --line: #2C3731;
    --accent: #7CC4A8; --accent-ink: #0E1A15; --accent-soft: #1F3A2F;
    --stamp: #B9A0E8; --rule: #D9695E; --lose: #3A2523;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121815; --surface: #1A221E; --ink: #E3E9E4; --muted: #9AA79F; --line: #2C3731;
  --accent: #7CC4A8; --accent-ink: #0E1A15; --accent-soft: #1F3A2F;
  --stamp: #B9A0E8; --rule: #D9695E; --lose: #3A2523;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
[hidden] { display: none !important; }
#app { max-width: 700px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 20px; }
a { color: var(--accent); }
h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; }
.sec { font-size: 1.3rem; display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.count { font: 600 0.8rem var(--mono); color: var(--muted); }
.brand { font: 600 0.78rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--stamp); text-decoration: none; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
.hint code, .paste code { font: 500 0.85em var(--mono); }
.masthead { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.02em; }
.field em { font-weight: 400; color: var(--muted); font-style: normal; }
input, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { font: 700 0.95rem var(--body); border-radius: 4px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--accent); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.icon-btn { width: 34px; height: 30px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 0.8rem; flex: none; }
.icon-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.actions, .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }

/* editor */
.editor { display: flex; flex-direction: column; gap: 12px; }
.note { background: var(--accent-soft); border-radius: 4px; padding: 10px 12px; font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.edit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.edit-row { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.edit-num { font: 600 0.85rem var(--mono); color: var(--stamp); width: 22px; padding-top: 10px; flex: none; }
.edit-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.edit-fields [data-f="title"] { font-weight: 700; }
.edit-pair { display: grid; grid-template-columns: 2fr 1.4fr 0.8fr; gap: 6px; }
.edit-row .icon-btn { margin-top: 5px; }
.paste summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.paste[open] { display: flex; flex-direction: column; gap: 8px; }
.paste textarea { font: 500 0.82rem/1.45 var(--mono); }
.paste-msg { font-size: 0.85rem; color: var(--muted); }
.recent ul { list-style: none; padding: 0; margin: 8px 0 0; }
.recent li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.recent li span { color: var(--muted); font: 500 0.8rem var(--mono); }
.foot { color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--line); padding-top: 14px; }

/* room */
.roomhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.relays { font: 500 0.75rem var(--mono); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.relays i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.relays.good i { background: #3E9B6E; } .relays.warn i { background: #D39B2A; } .relays.bad i { background: var(--rule); }
.pollhead { display: flex; flex-direction: column; gap: 10px; }
.share { display: flex; gap: 8px; flex-wrap: wrap; }
.share input { flex: 1 1 220px; font: 500 0.8rem var(--mono); color: var(--muted); }
.tabs { display: flex; border-bottom: 1px solid var(--line); gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; font: 700 1rem var(--body); color: var(--muted); padding: 12px 14px 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpanel { display: flex; flex-direction: column; gap: 16px; }
.voter { display: flex; flex-direction: column; gap: 6px; }
.name-row { display: flex; gap: 8px; }
.instr { margin: 0; font-size: 0.9rem; color: var(--muted); }

/* catalog cards */
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.card { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 14px 12px 14px 12px; position: relative; box-shadow: 0 1px 0 var(--line); }
.card.dragging { z-index: 10; box-shadow: 0 10px 28px rgba(0,0,0,0.18); border-color: var(--accent); transition: none; }
.stamp { font: 600 1.35rem/1 var(--mono); color: var(--stamp); border: 2px solid var(--stamp); border-radius: 4px; width: 38px; height: 38px; display: grid; place-items: center; transform: rotate(-4deg); flex: none; opacity: 0.9; font-variant-numeric: tabular-nums; }
.card:nth-child(even) .stamp { transform: rotate(3deg); }
.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.title { font: 1.15rem/1.25 var(--display); padding-bottom: 6px; margin-bottom: 2px; border-bottom: 1px solid var(--rule); }
.meta { font-size: 0.85rem; color: var(--muted); }
.meta .dot { padding: 0 6px; }
.meta .nw { white-space: nowrap; }
.desc { margin: 2px 0 0; font-size: 0.9rem; max-width: 60ch; }
.moves { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.handle { cursor: grab; touch-action: none; user-select: none; color: var(--muted); font-size: 1.3rem; line-height: 1; padding: 6px 8px; border-radius: 4px; }
.handle:hover { color: var(--accent); background: var(--accent-soft); }
.card.dragging .handle { cursor: grabbing; }
.castbar { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; }
.cast-msg { font-size: 0.85rem; color: var(--muted); flex: 1 1 200px; }

/* results */
.empty { text-align: center; padding: 40px 0; display: flex; flex-direction: column; gap: 6px; }
.empty p { margin: 0; }
.summary { display: flex; flex-direction: column; gap: 12px; }
.tally { margin: 0; }
.podium { display: flex; flex-direction: column; gap: 8px; }
.podium-row { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.podium-row.lead { border-color: var(--accent); background: var(--accent-soft); }
.p-title { font: 1.2rem/1.25 var(--display); }
.p-wins { font-size: 0.86rem; color: var(--muted); }
.pill { font: 600 0.68rem var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--stamp); border: 1px solid var(--stamp); border-radius: 3px; padding: 1px 5px; vertical-align: 3px; margin-left: 4px; white-space: nowrap; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.grid { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.grid th, .grid td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: center; font: 500 0.85rem var(--mono); }
.grid thead th { font: 700 0.72rem var(--body); color: var(--muted); vertical-align: bottom; white-space: nowrap; }
.grid th.bk { text-align: left; font: 700 0.88rem var(--body); position: sticky; left: 0; background: var(--surface); min-width: 130px; max-width: 170px; white-space: normal; }
.grid td.win { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.grid.pair td.beat { background: var(--accent-soft); }
.grid.pair td.lose { background: var(--lose); }
.grid.pair td.self { color: var(--line); }
.grid tbody tr:last-child > * { border-bottom: 0; }
.methods { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.method { border-bottom: 1px solid var(--line); }
.method summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; padding: 12px 2px; list-style: none; }
.method summary::-webkit-details-marker { display: none; }
.method summary::before { content: "▸"; color: var(--muted); margin-right: -4px; }
.method[open] summary::before { content: "▾"; }
.m-name { font-weight: 700; flex: 1; }
.m-win { color: var(--accent); text-align: right; font-size: 0.92rem; }
.about { margin: 0 0 10px; font-size: 0.9rem; color: var(--muted); max-width: 62ch; }
.m-rows { list-style: none; margin: 0 0 12px; padding: 0; }
.m-rows li { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, auto); gap: 8px; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 0.92rem; }
.m-place { font: 600 0.85rem var(--mono); color: var(--stamp); }
.m-score { font: 500 0.78rem var(--mono); color: var(--muted); text-align: right; max-width: 48vw; }
.rounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px; }
.round { background: var(--bg); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 0.85rem; }
.r-head { font: 600 0.72rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.r-line { display: grid; grid-template-columns: minmax(0, 1.4fr) 1fr 22px; gap: 8px; align-items: center; }
.r-line > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-line .bar { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
.r-line .bar i { display: block; height: 100%; background: var(--accent); }
.r-line.out { color: var(--muted); text-decoration: line-through; }
.r-line.out .bar i { background: var(--rule); }
.r-line.won { font-weight: 700; }
.r-line .n { font: 500 0.8rem var(--mono); text-align: right; }
.r-foot { color: var(--muted); font-size: 0.8rem; }
.ballots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ballots > li { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; }
.b-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin-bottom: 6px; }
.b-head span { font: 500 0.72rem var(--mono); color: var(--muted); }
.ballots ol { margin: 0; padding-left: 22px; font-size: 0.88rem; }
.ballots ol li::marker { font: 600 0.8rem var(--mono); color: var(--stamp); }

@media (max-width: 480px) {
  .edit-pair { grid-template-columns: 1fr 1fr; }
  .edit-pair [data-f="author"] { grid-column: 1 / -1; }
  .name-row .btn { padding-inline: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
